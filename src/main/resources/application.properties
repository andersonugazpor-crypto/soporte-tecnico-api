spring.application.name=soporte-tecnico-api
server.port=8080

# Carga datos de ejemplo al iniciar (true/false)
app.datos-iniciales=true

# Formato de fechas en JSON: "2026-11-01T13:45:10"
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Devuelve 404 propio para rutas inexistentes (manejado por GlobalExceptionHandler)
spring.mvc.problemdetails.enabled=false
